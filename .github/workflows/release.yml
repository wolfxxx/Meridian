name: Windows installer

# Builds Meridian-Setup-<version>.exe. Run it by hand from the Actions tab, or push a tag
# such as v0.1.0 to also publish the installer as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: meridian
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meridian
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meridian/ui/package-lock.json

      - name: Build the interface
        run: |
          cd ui
          npm ci
          npm run build

      - name: Build and install the engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install maturin numpy fastapi uvicorn pywebview pyinstaller pillow
          maturin build --release --out wheels
          pip install (Get-ChildItem wheels\*.whl).FullName

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and check the installer
        run: python packaging/build_installer.py --skip-ui --no-window-test

      - uses: actions/upload-artifact@v4
        with:
          name: Meridian-Setup
          path: meridian/dist/Meridian-Setup-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $f = (Get-ChildItem dist\Meridian-Setup-*.exe).FullName
          gh release create "${{ github.ref_name }}" $f --title "Meridian ${{ github.ref_name }}" --notes "Download Meridian-Setup and double-click it. No administrator rights, Python or other software needed."
