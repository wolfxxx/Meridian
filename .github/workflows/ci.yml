name: CI

on:
  push:
  pull_request:

jobs:
  meridian:
    name: meridian (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: meridian
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust lint
        run: cargo clippy -p meridian-core --all-targets -- -D warnings

      - name: Rust tests (engine)
        run: cargo test -p meridian-core

      - name: Build the app interface
        working-directory: meridian/ui
        run: |
          npm ci
          npm run build

      - name: Build Python package (engine + interface)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.7,<2.0" pytest numpy fastapi uvicorn httpx2
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist meridian

      - name: Python tests (reconciliation, engine, app service)
        run: python -m pytest -q

      - name: lifelib reconciliation showcases
        run: |
          python examples/run_lifelib_basicterm.py --scale 5
          python examples/run_lifelib_cashvalue.py
          python examples/run_sa_funeral.py --policies 2000

      - name: Smoke benchmark
        run: python examples/bench.py --policies 20000 --years 20
