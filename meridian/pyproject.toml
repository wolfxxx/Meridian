[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "meridian"
version = "0.2.0"
description = "Meridian prototype: Python modelling language over a Rust vectorised actuarial engine"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5"]
test = ["pytest>=8", "httpx2"]

[project.scripts]
meridian = "meridian.app.launcher:main"

[tool.maturin]
manifest-path = "crates/meridian-py/Cargo.toml"
python-source = "python"
module-name = "meridian._engine"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
